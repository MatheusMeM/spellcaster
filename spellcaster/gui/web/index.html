<!DOCTYPE html>
<html lang="pt-BR" data-transport="square" data-visualizer="bars">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellcaster</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="skins/feiticaria/skin.css" id="skin-css">
</head>
<body>
<header class="chrome">
  <span class="logo">SPELLCASTER</span>
  <nav class="tabs" id="tabs">
    <a href="#timeline">Timeline</a><a href="#patch">Patch</a><a href="#outputs">Outputs</a>
    <a href="#network">Network</a><a href="#log">Log</a>
  </nav>
  <span class="status" id="status" title="WebSocket /ws">offline</span>
  <label class="skinmenu">Skin <select id="skin"></select></label>
</header>

<main id="panels">
  <!--
  CONTRATO DE MONTAGEM DOS PAINEIS  (timeline em canvas, patch e outputs vem em outra rodada)

    App.panel("timeline", { mount(el) { ... } })

  - Registrar antes ou depois do load, tanto faz; mount(el) roda UMA vez, na primeira vez que
    o painel aparece, e recebe a <section data-panel="..."> ja visivel (tem largura/altura reais,
    da para dimensionar canvas). Nao ha unmount: o painel so e escondido (display:none).
  - Dentro do painel:
      App.rpc(cmd, args)      -> Promise com o result do registry (unico caminho para o engine)
      App.on(topic, fn)       -> broadcast; fn(payload) em topico de texto,
                                 fn(universe, Uint8Array(512)) no topico "dmx"
      App.transport           -> {state, t, dur, loop}; App.play/pause/stop/locate/toggleLoop
      App.log(txt)            -> linha no painel Log
      document.addEventListener("skin", e => ...)  -> skin trocada (e.detail = skin.json)
  - A skin e so CSS: usar as variaveis (--bg, --panel, --chrome, --accent, --text, --muted,
    --font, --radius, --bevel, --glow). O painel nunca le o nome da skin.
  - Carregar o JS do painel com <script src="timeline.js" defer> aqui embaixo, junto de app.js.
  -->
  <section data-panel="timeline"></section>
  <section data-panel="patch"></section>
  <section data-panel="outputs"></section>
  <section data-panel="network"></section>
  <section data-panel="log"><pre id="log"></pre></section>
</main>

<footer class="transport">
  <div class="buttons">
    <button id="play" title="Play/Pause (espaco)"><svg viewBox="0 0 16 16"><path class="ic-play" d="M3 2l11 6-11 6z"/><path class="ic-pause" d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
    <button id="stop" title="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg></button>
    <button id="loop" title="Loop (L)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a5 5 0 0 1 9-3M13 8a5 5 0 0 1-9 3"/><path d="M12 2v3h-3M4 14v-3h3"/></svg></button>
  </div>
  <span class="timecode" id="tc">00:00:00:00</span>
  <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" title="Scrub (Home = 0)">
  <canvas id="vu" width="240" height="40" title="VU dos universos"></canvas>
</footer>

<script src="skins.js"></script>
<script src="app.js"></script>
</body>
</html>
