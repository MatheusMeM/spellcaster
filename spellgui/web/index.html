<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Spellcaster — timeline</title>
<link rel="stylesheet" href="../../design/tokens/spellcaster.css">
<style>
  /* Tres faixas fixas na altura da janela: toolbar, canvas, barra de status. A pagina NUNCA rola
     (`overflow:hidden` em html e body): rolar e' coisa das tracks, dentro do canvas, e a toolbar e
     a barra de status ficam onde estao. O canvas e' `flex: 1 1 0` com `min-height: 0` dentro de
     `.mid` posicionado: sem isso o atributo `height` do canvas (altura * dpr) vira altura
     intrinseca, o body estoura, aparece a barra de rolagem da pagina e a area das tracks desce
     para fora da tela. Faixa em flex, e nao `grid-template-rows`: a primeira linha do <body> esta'
     reservada para o `<div id="nav">` da GUI, e um filho a mais nao pode reordenar as faixas. */
  * { box-sizing: border-box; }
  html, body { height: 100vh; margin: 0; overflow: hidden; background: var(--sc-bg);
               color: var(--sc-fg); font: var(--sc-text-sm)/1.3 var(--sc-mono); }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sc-gap); padding: 6px 8px;
         background: var(--sc-panel); border-bottom: 1px solid var(--sc-line); flex: 0 0 auto; }
  .bar button, .bar input,
  .bar input[type=file]::file-selector-button { background: var(--sc-panel-2); color: var(--sc-fg);
                            border: 1px solid var(--sc-line);
                            border-radius: var(--sc-radius); font: 12px var(--sc-mono); padding: 5px 9px; }
  .bar button:hover { border-color: var(--sc-fg-3); }
  .bar button.on { border-color: var(--sc-accent); color: var(--sc-accent); }
  .bar input[type=text] { width: 230px; min-width: 110px; }
  .bar input[type=file] { border: 0; padding: 0; font-size: 0; }
  .sep { width: 1px; height: 20px; background: var(--sc-line); }
  .over { color: var(--sc-fg-3); font-size: var(--sc-text-xs); letter-spacing: var(--sc-tracking);
          text-transform: uppercase; font-family: var(--sc-label); }
  .mid { flex: 1 1 0; min-height: 0; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  /* Nome do show e contagem de tracks moram aqui: na toolbar empurravam botao para fora numa
     janela de 1000 px. O texto de atalhos encolhe com reticencias em vez de alargar a barra. */
  .cli { flex: 0 0 auto; display: flex; align-items: baseline; gap: var(--sc-gap); padding: 4px 8px;
         background: var(--sc-panel); border-top: 1px solid var(--sc-line);
         color: var(--sc-fg-3); font-size: var(--sc-text-xs); }
  .cli b { flex: 0 0 auto; color: var(--sc-fg-2); font-weight: normal; white-space: nowrap; }
  .cli span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .menu { display: none; position: fixed; background: var(--sc-panel-2); border: 1px solid var(--sc-line); z-index: 9; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0;
                 color: var(--sc-fg); font: 12px var(--sc-mono); padding: 4px 14px 4px 8px; }
  .menu button:hover { background: var(--sc-accent); color: var(--sc-bg); }
</style>
</head>
<body>
<div id="nav"></div>
<script src="nav.js"></script>
<div class="bar">
  <span class="over">timeline</span>
  <input type="text" id="path" value="../../shows/medgrupo.spell" title="caminho do .spell (Ctrl+O foca aqui)">
  <button id="open" title="Abrir (Ctrl+O)">Abrir</button>
  <input type="file" id="file" accept=".spell,.json" title="abrir .spell do disco (file:// bloqueia fetch)">
  <span class="sep"></span>
  <button id="play" title="Play / pause (Espaco)">Play</button>
  <button id="pause" title="Pause (K)">Pause</button>
  <button id="stop" title="Stop (Home volta ao inicio)">Stop</button>
  <button id="in" title="Marcar In no playhead (I)">In</button>
  <button id="out" title="Marcar Out no playhead (O)">Out</button>
  <button id="loop" title="Loop no intervalo In-Out (Ctrl+L)">Loop</button>
  <button id="snap" class="on" title="Snapping (S)">Snap</button>
  <button id="rec" title="Record arm do track focado (R)">Rec arm</button>
  <button id="fit" title="Ajustar tudo (\ ou Shift+Z)">Fit</button>
  <span class="sep"></span>
  <button id="tadd" title="Novo track dmx">+Track</button>
  <button id="tdel" title="Apagar o track focado">-Track</button>
  <button id="mon" title="Monitor DMX do track focado (Alt+M)">Monitor</button>
  <button id="undo" title="Desfazer (Ctrl+Z); refazer = Ctrl+Shift+Z">Desfazer</button>
  <button id="new" title="Novo show (Ctrl+N)">Novo</button>
  <button id="save" title="Salvar (Ctrl+S); salvar como = Ctrl+Shift+S">Salvar</button>
</div>
<div class="mid"><canvas id="cv" tabindex="0"></canvas></div>
<div class="cli"><b id="msg"></b><span id="keys"></span></div>
<div class="menu" id="menu"></div>
<script src="canvaskit.js"></script>
<script src="timeline.js"></script>
<script src="teatro.js"></script>
<script src="viewer.js"></script>
<script>
"use strict";
const q = id => document.getElementById(id);
const msg = q("msg");
q("keys").textContent =
  "Espaco toca | J/K/L shuttle, K+J/K+L quadro a quadro | setas 1 quadro, Shift 5 | I/O intervalo, " +
  "Ctrl+L loop | M marcador, Shift+M edita | S snap, R rec, Shift+D mute, Shift+S solo | " +
  "Ctrl+K keyframe, Ctrl+E easing | Ctrl+Z desfaz, Ctrl+Shift+Z refaz | Ctrl+N novo, Ctrl+O abre, " +
  "Ctrl+S salva, Ctrl+Shift+S salva como | Alt+M monitor | = / - zoom, \\ ajusta | " +
  "roda rola, Shift+roda anda, Ctrl+roda zoom";
TL.mount(q("cv"), q("menu"), msg);
TL.load({ name: "vazio", fps: 30, duration: 60, tracks: [], markers: [] });

q("open").onclick = () => { TL.file = q("path").value; TL.fetch(TL.file).catch(e => { msg.textContent = e.message; }); };
q("file").onchange = e => {
  const f = e.target.files[0];
  if (f) f.text().then(t => { TL.load(JSON.parse(t)); q("cv").focus(); })
                 .catch(err => { msg.textContent = err.message; });
};
q("play").onclick = () => TL.play(1);
q("pause").onclick = () => TL.play(0);
q("stop").onclick = () => TL.stop();
q("in").onclick = () => TL.setInOut(TL.t, null);
q("out").onclick = () => TL.setInOut(null, TL.t);
q("loop").onclick = () => TL.setLoop(!TL.loop);
q("snap").onclick = () => { TL.snap = !TL.snap; q("snap").classList.toggle("on", TL.snap); TL.k.invalidate(); };
// ponytail: record arm e so o estado visual da lane (nada grava) ; ligar quando o engine gravar.
q("rec").onclick = () => {
  if (TL.cur >= 0) TL.lanes[TL.cur].rec = !TL.lanes[TL.cur].rec;
  TL.onState();
  TL.k.invalidate();
};
q("fit").onclick = () => TL.fit();
q("tadd").onclick = () => TL.trackAdd();
q("tdel").onclick = () => TL.trackDel();
q("mon").onclick = () => { TL.mon = !TL.mon; TL.onState(); TL.k.invalidate(); };
q("undo").onclick = () => TL.undo(-1);
q("new").onclick = () => TL.showNew();
q("save").onclick = () => TL.save();

// Ctrl+O nao abre dialogo: foca o campo de caminho, que ja' e' o "abrir" desta pagina.
TL.onOpen = () => { const p = q("path"); p.focus(); p.select(); };

// O botao Play so acende quando ha transporte andando (local ou do engine): a timeline chama isto
// em toda mudanca de transporte, no Alt+M do monitor e quando o loop do engine muda de estado.
TL.onState = () => {
  q("play").classList.toggle("on", !!TL.rate);
  q("mon").classList.toggle("on", TL.mon);
  q("loop").classList.toggle("on", TL.loop);
  q("rec").classList.toggle("on", TL.cur >= 0 && !!TL.lanes[TL.cur] && !!TL.lanes[TL.cur].rec);
};

TL.k.loop();
TL.file = q("path").value;
TL.fetch(TL.file).catch(e => {
  msg.textContent = e.message + " — sem servidor, use o seletor de arquivo";
  TL.load({ name: "sem show", fps: 30, duration: 60, tracks: [], markers: [] });
});
// Com `spellcore serve` o WS assume: GET /show carrega, os eventos `transport` movem o playhead e
// cada edicao vira comando do registry. Sem servidor o WS fecha e a pagina segue offline.
if (location.protocol.indexOf("http") === 0) TL.connect();
</script>
</body>
</html>
