<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Spellcaster — timeline</title>
<link rel="stylesheet" href="../../design/tokens/spellcaster.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--sc-bg); color: var(--sc-fg);
               font: var(--sc-text-sm)/1.3 var(--sc-mono); }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: var(--sc-gap); padding: 6px 8px;
         background: var(--sc-panel); border-bottom: 1px solid var(--sc-line); flex: 0 0 auto; }
  .bar button, .bar input { background: var(--sc-panel-2); color: var(--sc-fg); border: 1px solid var(--sc-line);
                            border-radius: var(--sc-radius); font: 12px var(--sc-mono); padding: 5px 9px; }
  .bar button:hover { border-color: var(--sc-fg-3); }
  .bar button.on { border-color: var(--sc-accent); color: var(--sc-accent); }
  .bar input[type=text] { width: 230px; }
  .bar input[type=file] { border: 0; padding: 0; font-size: 0; }
  .bar input[type=file]::file-selector-button { background: var(--sc-panel-2); color: var(--sc-fg);
    border: 1px solid var(--sc-line); border-radius: var(--sc-radius); font: 12px var(--sc-mono); padding: 5px 9px; }
  .sep { width: 1px; height: 20px; background: var(--sc-line); }
  .over { color: var(--sc-fg-3); font-size: var(--sc-text-xs); letter-spacing: var(--sc-tracking);
          text-transform: uppercase; font-family: var(--sc-label); }
  #cv { flex: 1 1 auto; width: 100%; display: block; outline: none; }
  .cli { flex: 0 0 auto; padding: 4px 8px; background: var(--sc-panel); border-top: 1px solid var(--sc-line);
         color: var(--sc-fg-3); font-size: var(--sc-text-xs); }
  .menu { display: none; position: fixed; background: var(--sc-panel-2); border: 1px solid var(--sc-line); z-index: 9; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0;
                 color: var(--sc-fg); font: 12px var(--sc-mono); padding: 4px 14px 4px 8px; }
  .menu button:hover { background: var(--sc-accent); color: var(--sc-bg); }
</style>
</head>
<body>
<div class="bar">
  <span class="over">timeline</span>
  <input type="text" id="path" value="../../shows/medgrupo.spell">
  <button id="open">Abrir</button>
  <input type="file" id="file" accept=".spell,.json" title="abrir .spell do disco (file:// bloqueia fetch)">
  <span class="sep"></span>
  <button id="play">Play</button><button id="in">In</button><button id="out">Out</button>
  <button id="loop">Loop</button><button id="snap" class="on">Snap</button>
  <button id="rec">Rec arm</button><button id="fit">Fit</button>
  <span class="sep"></span>
  <span class="over" id="msg"></span>
</div>
<canvas id="cv" tabindex="0"></canvas>
<div class="cli" id="cli">spell play shows/medgrupo.spell &nbsp;|&nbsp; Space toca, J/K/L shuttle, I/O intervalo, M marcador, S snap, = / - zoom, \ ajusta</div>
<div class="menu" id="menu"></div>
<script src="canvaskit.js"></script>
<script src="timeline.js"></script>
<script>
"use strict";
const q = id => document.getElementById(id);
const msg = q("msg");
const arg = new URLSearchParams(location.search).get("show");   // ?show=<caminho> abre outro .spell
if (arg) q("path").value = arg;
TL.mount(q("cv"), { menu: q("menu"), msg });

const show = () => TL.show || (TL.show = { name: "vazio", fps: 30, duration: 60, tracks: [], markers: [] });
const load = data => { TL.load(data); q("cv").focus(); };

q("open").onclick = () => TL.fetch(q("path").value).catch(e => { msg.textContent = e.message; });
q("file").onchange = e => {
  const f = e.target.files[0];
  if (f) f.text().then(t => load(JSON.parse(t))).catch(err => { msg.textContent = err.message; });
};
q("play").onclick = () => { TL.play(TL.rate ? 0 : 1); q("play").classList.toggle("on", !!TL.rate); };
q("in").onclick = () => { show().in = TL.t; TL.commit(); };
q("out").onclick = () => { show().out = TL.t; TL.commit(); };
q("loop").onclick = () => { TL.loop = !TL.loop; q("loop").classList.toggle("on", TL.loop); };
q("snap").onclick = () => { TL.snap = !TL.snap; q("snap").classList.toggle("on", TL.snap); TL.k.invalidate(); };
// ponytail: record arm e so o estado visual da lane (nada grava) ; ligar quando houver IPC com o engine.
q("rec").onclick = () => {
  if (TL.cur >= 0) TL.lanes[TL.cur].rec = !TL.lanes[TL.cur].rec;
  q("rec").classList.toggle("on", TL.cur >= 0 && TL.lanes[TL.cur].rec);
  TL.k.invalidate();
};
q("fit").onclick = () => TL.fit();

TL.k.loop();
TL.fetch(q("path").value).catch(e => {
  msg.textContent = e.message + " — use o seletor de arquivo";
  TL.load({ name: "sem show", fps: 30, duration: 60, tracks: [], markers: [] });
});
</script>
</body>
</html>
