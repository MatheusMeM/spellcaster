<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spellcaster — timeline</title>
<link rel="stylesheet" href="../../design/tokens/spellcaster.css">
<style>
  /* Three fixed bands in the window height: toolbar, canvas, status bar. The page NEVER scrolls
     (`overflow:hidden` on html and body): scrolling belongs to the tracks, inside the canvas, and
     the toolbar and the status bar stay where they are. The canvas is `flex: 1 1 0` with
     `min-height: 0` inside a positioned `.mid`: without that the canvas `height` attribute
     (height * dpr) becomes the intrinsic height, the body overflows, the page scrollbar shows up
     and the track area drops off screen. Bands in flex, and not `grid-template-rows`: the first
     row of <body> is reserved for the GUI `<div id="nav">`, and one extra child must not reorder
     the bands. */
  * { box-sizing: border-box; }
  html, body { height: 100vh; margin: 0; overflow: hidden; background: var(--sc-bg);
               color: var(--sc-fg); font: var(--sc-text-sm)/1.3 var(--sc-mono); }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sc-gap); padding: 6px 8px;
         background: var(--sc-panel); border-bottom: 1px solid var(--sc-line); flex: 0 0 auto; }
  .bar button, .bar input,
  .bar input[type=file]::file-selector-button { background: var(--sc-panel-2); color: var(--sc-fg);
                            border: 1px solid var(--sc-line);
                            border-radius: var(--sc-radius); font: 12px var(--sc-mono); padding: 5px 9px; }
  .bar button:hover { border-color: var(--sc-fg-3); }
  .bar button.on { border-color: var(--sc-accent); color: var(--sc-accent); }
  .bar input[type=text] { width: 230px; min-width: 110px; }
  .bar input[type=file] { border: 0; padding: 0; font-size: 0; }
  .sep { width: 1px; height: 20px; background: var(--sc-line); }
  .over { color: var(--sc-fg-3); font-size: var(--sc-text-xs); letter-spacing: var(--sc-tracking);
          text-transform: uppercase; font-family: var(--sc-label); }
  .mid { flex: 1 1 0; min-height: 0; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  /* Show name and track count live here: in the toolbar they pushed a button off screen in a
     1000 px window. The shortcut text shrinks with an ellipsis instead of widening the bar. */
  .cli { flex: 0 0 auto; display: flex; align-items: baseline; gap: var(--sc-gap); padding: 4px 8px;
         background: var(--sc-panel); border-top: 1px solid var(--sc-line);
         color: var(--sc-fg-3); font-size: var(--sc-text-xs); }
  .cli b { flex: 0 0 auto; color: var(--sc-fg-2); font-weight: normal; white-space: nowrap; }
  .cli span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .menu { display: none; position: fixed; background: var(--sc-panel-2); border: 1px solid var(--sc-line); z-index: 9; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0;
                 color: var(--sc-fg); font: 12px var(--sc-mono); padding: 4px 14px 4px 8px; }
  .menu button:hover { background: var(--sc-accent); color: var(--sc-bg); }
</style>
</head>
<body>
<div id="nav"></div>
<script src="nav.js"></script>
<div class="bar">
  <span class="over">timeline</span>
  <input type="text" id="path" value="../../shows/medgrupo.spell" title="path of the .spell (Ctrl+O focuses here)">
  <button id="open" title="Open (Ctrl+O)">Open</button>
  <input type="file" id="file" accept=".spell,.json" title="open a .spell from disk (file:// blocks fetch)">
  <span class="sep"></span>
  <button id="play" title="Play / pause (Space)">Play</button>
  <button id="pause" title="Pause (K)">Pause</button>
  <button id="stop" title="Stop (Home goes back to the start)">Stop</button>
  <button id="in" title="Mark In at the playhead (I)">In</button>
  <button id="out" title="Mark Out at the playhead (O)">Out</button>
  <button id="loop" title="Loop over the In-Out range (Ctrl+L)">Loop</button>
  <button id="snap" class="on" title="Snapping (S)">Snap</button>
  <button id="rec" title="Record arm of the focused track (R)">Rec arm</button>
  <button id="fit" title="Fit everything (\ or Shift+Z)">Fit</button>
  <span class="sep"></span>
  <button id="tadd" title="New dmx track">+Track</button>
  <button id="tdel" title="Delete the focused track">-Track</button>
  <button id="mon" title="DMX monitor of the focused track (Alt+M)">Monitor</button>
  <button id="undo" title="Undo (Ctrl+Z); redo = Ctrl+Shift+Z">Undo</button>
  <button id="new" title="New show (Ctrl+N)">New</button>
  <button id="save" title="Save (Ctrl+S); save as = Ctrl+Shift+S">Save</button>
</div>
<div class="mid"><canvas id="cv" tabindex="0"></canvas></div>
<div class="cli"><b id="msg"></b><span id="keys"></span></div>
<div class="menu" id="menu"></div>
<div class="menu" id="tmenu"></div>
<script src="canvaskit.js"></script>
<script src="timeline.js"></script>
<script src="teatro.js"></script>
<script src="viewer.js"></script>
<script>
"use strict";
const q = id => document.getElementById(id);
const msg = q("msg");
q("keys").textContent =
  "Space plays | J/K/L shuttle, K+J/K+L frame by frame | arrows 1 frame, Shift 5 | I/O range, " +
  "Ctrl+L loop | M marker, Shift+M edits | S snap, R rec, Shift+D mute, Shift+S solo | " +
  "Ctrl+K keyframe, Ctrl+E easing | Ctrl+Z undo, Ctrl+Shift+Z redo | Ctrl+N new, Ctrl+O open, " +
  "Ctrl+S save, Ctrl+Shift+S save as | Alt+M monitor (input when armed) | = / - zoom, \\ fit | " +
  "wheel scrolls, Shift+wheel moves, Ctrl+wheel zooms";
TL.mount(q("cv"), q("menu"), msg);
TL.load({ name: "empty", fps: 30, duration: 60, tracks: [], markers: [] });

q("open").onclick = () => { TL.file = q("path").value; TL.fetch(TL.file).catch(e => { msg.textContent = e.message; }); };
q("file").onchange = e => {
  const f = e.target.files[0];
  if (f) f.text().then(t => { TL.load(JSON.parse(t)); q("cv").focus(); })
                 .catch(err => { msg.textContent = err.message; });
};
q("play").onclick = () => TL.play(1);
q("pause").onclick = () => TL.play(0);
q("stop").onclick = () => TL.stop();
q("in").onclick = () => TL.setInOut(TL.t, null);
q("out").onclick = () => TL.setInOut(null, TL.t);
q("loop").onclick = () => TL.setLoop(!TL.loop);
q("snap").onclick = () => { TL.snap = !TL.snap; q("snap").classList.toggle("on", TL.snap); TL.k.invalidate(); };
// The arm lives in the engine (rec_arm); the bar only calls the same funnel as the R key.
q("rec").onclick = () => {
  if (TL.cur >= 0) TL.recArm(TL.cur);
  TL.onState();
  TL.k.invalidate();
};
q("fit").onclick = () => TL.fit();
// +Track opens a type menu. `laser` lists the .ild files the engine sees (laser_files), with no
// native dialog; `fx` asks for the .rhai. Video is not in: GStreamer/NDI depend on an SDK (ROADMAP R2).
const tmenu = q("tmenu");
function tItem(txt, fn) {
  const b = document.createElement("button");
  b.textContent = txt;
  b.onclick = fn;
  tmenu.appendChild(b);
}
q("tadd").onclick = () => {
  const r = q("tadd").getBoundingClientRect();
  tmenu.innerHTML = "";
  tItem("dmx", () => { tmenu.style.display = "none"; TL.trackAdd("dmx"); });
  tItem("laser (.ild)", () => {
    tmenu.innerHTML = "";
    TL.laserFiles().then(fs => {
      if (!fs.length) return tItem("(no .ild)", () => { tmenu.style.display = "none"; });
      for (const f of fs) tItem(f.name, () => { tmenu.style.display = "none"; TL.trackAdd("laser", f.name); });
    });
  });
  tItem("fx (.rhai)", () => {
    tmenu.style.display = "none";
    const n = prompt("script .rhai (next to the .spell):", "medgrupo.rhai");
    if (n) TL.trackAdd("fx", n);
  });
  tmenu.style.left = r.left + "px";
  tmenu.style.top = r.bottom + "px";
  tmenu.style.display = "block";
};
addEventListener("pointerdown", e => {
  if (tmenu.style.display === "block" && !tmenu.contains(e.target) && e.target !== q("tadd"))
    tmenu.style.display = "none";
}, true);
q("tdel").onclick = () => TL.trackDel();
q("mon").onclick = () => { TL.mon = !TL.mon; TL.onState(); TL.k.invalidate(); };
q("undo").onclick = () => TL.undo(-1);
q("new").onclick = () => TL.showNew();
q("save").onclick = () => TL.save();

// Ctrl+O opens no dialog: it focuses the path field, which already is the "open" of this page.
TL.onOpen = () => { const p = q("path"); p.focus(); p.select(); };

// The Play button only lights up when there is transport running (local or from the engine): the
// timeline calls this on every transport change, on the Alt+M of the monitor and when the engine
// loop changes state.
TL.onState = () => {
  q("play").classList.toggle("on", !!TL.rate);
  q("mon").classList.toggle("on", TL.mon);
  q("loop").classList.toggle("on", TL.loop);
  q("rec").classList.toggle("on", TL.cur >= 0 && !!TL.lanes[TL.cur] && !!TL.lanes[TL.cur].rec);
};

TL.k.loop();
TL.file = q("path").value;
TL.fetch(TL.file).catch(e => {
  msg.textContent = e.message + " — no server, use the file picker";
  TL.load({ name: "no show", fps: 30, duration: 60, tracks: [], markers: [] });
});
// With `spellcore serve` the WS takes over: GET /show loads, the `transport` events move the
// playhead and every edit becomes a registry command. With no server the WS closes and the page
// carries on offline.
if (location.protocol.indexOf("http") === 0) TL.connect();
</script>
</body>
</html>
