<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Spellcaster — patchbay</title>
<link rel="stylesheet" href="../../design/tokens/spellcaster.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--sc-bg); color: var(--sc-fg);
               font: var(--sc-text-sm)/1.3 var(--sc-mono); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .zonas { flex: 1 1 auto; display: flex; min-height: 0; }        /* Chataigne: lista, canvas, Inspector */
  .centro { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 8px;
         white-space: nowrap; overflow: hidden;
         background: var(--sc-panel); border-bottom: 1px solid var(--sc-line); }
  .bar button, .bar input { background: var(--sc-panel-2); color: var(--sc-fg); border: 1px solid var(--sc-line);
                            border-radius: var(--sc-radius); font: 12px var(--sc-mono); padding: 5px 9px; }
  .bar input[type=text] { width: 260px; }
  .over { color: var(--sc-fg-3); font-size: var(--sc-text-xs); letter-spacing: var(--sc-tracking);
          text-transform: uppercase; font-family: var(--sc-label); }
  .ruim { color: var(--sc-live); }
  #cat { flex: 0 0 200px; background: var(--sc-panel); border-right: 1px solid var(--sc-line);
         overflow: auto; padding: 4px; }
  #cat button { display: block; width: 100%; text-align: left; background: none; border: 0;
                color: var(--sc-fg-2); font: 11px var(--sc-mono); padding: 3px 6px; }
  #cat button:hover { background: var(--sc-accent); color: var(--sc-bg); }
  #cv { flex: 1 1 auto; width: 100%; min-height: 0; display: block; outline: none; }
  #insp { flex: 0 0 260px; background: var(--sc-panel); border-left: 1px solid var(--sc-line);
          overflow: auto; padding: 6px; }
  #insp label { display: flex; justify-content: space-between; align-items: center; gap: 6px;
                margin: 3px 0; color: var(--sc-fg-2); font-size: 11px; }
  #insp input, #insp select { width: 130px; background: var(--sc-panel-2); color: var(--sc-fg);
                border: 1px solid var(--sc-line); font: 11px var(--sc-mono); padding: 2px 4px; }
  #insp input[type=checkbox] { width: auto; }
  #log { flex: 0 0 132px; background: var(--sc-well); border-top: 1px solid var(--sc-line);
         overflow: auto; padding: 4px 8px; color: var(--sc-fg-3); font-size: var(--sc-text-xs); }
  #add { display: none; position: fixed; z-index: 9; background: var(--sc-panel-2);
         border: 1px solid var(--sc-accent); padding: 4px; }
  #add input { width: 200px; background: var(--sc-well); color: var(--sc-fg);
               border: 1px solid var(--sc-line); font: 12px var(--sc-mono); padding: 4px; }
  #add div { max-height: 46vh; overflow: auto; }
  #add button { display: block; width: 100%; text-align: left; background: none; border: 0;
                color: var(--sc-fg); font: 11px var(--sc-mono); padding: 3px 6px; }
  #add button:hover { background: var(--sc-accent); color: var(--sc-bg); }
</style>
</head>
<body>
<div id="nav"></div>
<script src="nav.js"></script>
<div class="bar">
  <span class="over">patchbay</span>
  <input type="text" id="path" value="shows/patchbay_demo.spell" title="caminho como o engine ve, a partir da raiz do repo">
  <button id="open">Abrir</button>
  <span class="over" id="estado">offline</span>
  <span class="over" id="aviso"></span>
  <span class="over">Shift+A add &nbsp; Delete &nbsp; Shift+Delete religa &nbsp; Ctrl+] / Ctrl+[ grupo &nbsp;
    M mute &nbsp; L lock &nbsp; Shift+G grupo &nbsp; Ctrl+Z &nbsp; Shift+Z enquadra</span>
</div>
<div class="zonas">
  <div id="cat"></div>
  <div class="centro">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="log"></div>
  </div>
  <div id="insp"></div>
</div>
<div id="add"><input type="text" placeholder="tipo de no..."><div></div></div>
<script src="bus.js"></script>
<script src="canvaskit.js"></script>
<script src="catalog.js"></script>
<script src="graph.js"></script>
<script>
"use strict";
const q = id => document.getElementById(id);
PB.init({ cv: q("cv"), cat: q("cat"), insp: q("insp"), log: q("log"),
          aviso: q("aviso"), add: q("add"), estado: q("estado") });
const arg = new URLSearchParams(location.search).get("show");
if (arg) q("path").value = arg;
q("open").onclick = () => PB.carrega(q("path").value);
PB.liga(q("path").value);
</script>
</body>
</html>
