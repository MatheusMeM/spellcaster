# CI e deploy. Push em main / PR: testes Python em loopback nas tres plataformas, testes + clippy do
# spellcore, artefatos (onedir Windows, tarball Lite, binario spellcore). Tag v*: GitHub Release com
# os mesmos artefatos anexados. Bench de jitter/throughput e' gate (falha se sair do alvo do PRD).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      # ponytail: sem leg arm ; build_lite.sh empacota so .py + shows + profiles, o tarball do
      # arm sai byte a byte igual ao do x64 (e colidia no merge do release)
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: testes
        run: python -m unittest discover -s tests

      - name: onedir (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File packaging/build_win.ps1 -Out "${{ runner.temp }}/spellcaster_build"

      - name: fumaca do exe congelado
        if: runner.os == 'Windows'
        run: |
          & "${{ runner.temp }}/spellcaster_build/dist/Spellcaster/spell.exe" --version
          & "${{ runner.temp }}/spellcaster_build/dist/Spellcaster/spell.exe" tui --seconds 2

      - name: zip do onedir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "${{ runner.temp }}/spellcaster_build/dist/Spellcaster" -DestinationPath "${{ runner.temp }}/spellcaster-windows-x64.zip"

      - name: tarball Lite (Linux)
        if: runner.os == 'Linux'
        run: sh packaging/build_lite.sh "${{ runner.temp }}"

      - uses: actions/upload-artifact@v4
        with:
          name: spellcaster-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/spellcaster-windows-x64.zip
            ${{ runner.temp }}/spellcaster-lite-*.tar.gz
          if-no-files-found: error

  spellcore:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: spellcore.exe
            name: spellcore-windows-x64.exe
          - os: ubuntu-latest
            bin: spellcore
            name: spellcore-linux-x64
          - os: ubuntu-24.04-arm
            bin: spellcore
            name: spellcore-linux-aarch64
          # Pi aarch64 estatico (PRD 6). O runner ja e' aarch64: musl e' so mais um target do
          # rustup, sem cross nem zigbuild. A unica dep com codigo C e' o midir (ALSA), que o
          # protocols so liga fora do musl; o musl-libc que vem com o std basta.
          - os: ubuntu-24.04-arm
            bin: spellcore
            name: spellcore-linux-aarch64-static
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      T: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      REL: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: target musl
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: ALSA para o midir
        if: runner.os == 'Linux' && !matrix.target
        run: sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spellcore
          key: ${{ matrix.name }}

      - name: clippy
        working-directory: spellcore
        run: cargo clippy --workspace --all-targets ${{ env.T }} -- -D warnings

      - name: testes (inclui conformidade byte a byte com os fixtures)
        working-directory: spellcore
        run: cargo test --workspace ${{ env.T }}

      - name: release
        working-directory: spellcore
        run: cargo build --release --workspace ${{ env.T }}

      - name: confirma que o binario e' estatico
        if: matrix.target
        shell: bash
        working-directory: spellcore
        run: |
          B="${{ env.REL }}/${{ matrix.bin }}"
          file "$B"
          ls -l "$B"
          if readelf -d "$B" | grep -q NEEDED; then echo "tem dependencia dinamica"; exit 1; fi

      - name: bench como gate (jitter e throughput)
        # ponytail: runner compartilhado tem ruido, aqui so reporta ; tirar continue-on-error em runner self-hosted
        continue-on-error: true
        working-directory: spellcore
        run: |
          ./${{ env.REL }}/jitter --secs 5
          ./${{ env.REL }}/throughput

      - name: renomeia o binario
        shell: bash
        run: cp "spellcore/${{ env.REL }}/${{ matrix.bin }}" "${{ runner.temp }}/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, spellcore]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
