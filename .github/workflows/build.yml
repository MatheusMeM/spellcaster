# CI and deploy. Push to main / PR: Python tests on loopback across the three platforms, spellcore
# tests + clippy, artifacts (Windows onedir, Lite tarball, spellcore binary). Tag v*: GitHub Release
# with the same artifacts attached. The jitter/throughput bench is a gate (it fails if it leaves the
# PRD target).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      # ponytail: no arm leg ; build_lite.sh packages only .py + shows + profiles, so the arm tarball
      # comes out byte for byte the same as the x64 one (and collided in the release merge)
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: tests
        run: python -m unittest discover -s tests

      - name: onedir (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File packaging/build_win.ps1 -Out "${{ runner.temp }}/spellcaster_build"

      - name: smoke test of the frozen exe
        if: runner.os == 'Windows'
        run: |
          & "${{ runner.temp }}/spellcaster_build/dist/Spellcaster/spell.exe" --version
          & "${{ runner.temp }}/spellcaster_build/dist/Spellcaster/spell.exe" tui --seconds 2

      - name: zip the onedir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "${{ runner.temp }}/spellcaster_build/dist/Spellcaster" -DestinationPath "${{ runner.temp }}/spellcaster-windows-x64.zip"

      - name: Lite tarball (Linux)
        if: runner.os == 'Linux'
        run: sh packaging/build_lite.sh "${{ runner.temp }}"

      - uses: actions/upload-artifact@v4
        with:
          name: spellcaster-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/spellcaster-windows-x64.zip
            ${{ runner.temp }}/spellcaster-lite-*.tar.gz
          if-no-files-found: error

  spellcore:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: spellcore.exe
            name: spellcore-windows-x64.exe
          - os: ubuntu-latest
            bin: spellcore
            name: spellcore-linux-x64
          - os: ubuntu-24.04-arm
            bin: spellcore
            name: spellcore-linux-aarch64
          # Static Pi aarch64 (PRD 6). The runner is already aarch64: musl is just one more rustup
          # target, no cross and no zigbuild. The only dep with C code is midir (ALSA), which
          # protocols only links outside musl; the musl-libc that ships with std is enough.
          - os: ubuntu-24.04-arm
            bin: spellcore
            name: spellcore-linux-aarch64-static
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      T: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      REL: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: musl target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: ALSA for midir
        if: runner.os == 'Linux' && !matrix.target
        run: sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spellcore
          key: ${{ matrix.name }}

      - name: clippy
        working-directory: spellcore
        run: cargo clippy --workspace --all-targets ${{ env.T }} -- -D warnings

      - name: tests (including byte-for-byte conformance with the fixtures)
        working-directory: spellcore
        run: cargo test --workspace ${{ env.T }}

      - name: release
        working-directory: spellcore
        run: cargo build --release --workspace ${{ env.T }}

      - name: confirm the binary is static
        if: matrix.target
        shell: bash
        working-directory: spellcore
        run: |
          B="${{ env.REL }}/${{ matrix.bin }}"
          file "$B"
          ls -l "$B"
          if readelf -d "$B" | grep -q NEEDED; then echo "has a dynamic dependency"; exit 1; fi

      - name: bench as a gate (jitter and throughput)
        # ponytail: a shared runner is noisy, this only reports ; drop continue-on-error on a self-hosted runner
        continue-on-error: true
        working-directory: spellcore
        run: |
          ./${{ env.REL }}/jitter --secs 5
          ./${{ env.REL }}/throughput

      - name: rename the binary
        shell: bash
        run: cp "spellcore/${{ env.REL }}/${{ matrix.bin }}" "${{ runner.temp }}/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, spellcore]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
