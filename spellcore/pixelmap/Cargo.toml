[package]
name = "pixelmap"
version.workspace = true
edition.workspace = true

[dependencies]
# ~600 independent universes per frame: pure data parallelism, no thread pool of our own
rayon = "1"
# the "pixelmaps" block of the .spell is JSON (serde_json stays in the caller; the crate only
# declares the types)
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bin]]
name = "map_bench"
path = "src/bin/map_bench.rs"

[[bench]]
name = "pixelmap"
harness = false
