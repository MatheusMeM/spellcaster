[package]
name = "laser"
version.workspace = true
edition.workspace = true

[dependencies]
# the Ether Dream beacon (UDP 7654) already exists in protocols::netscan; reuse instead of
# reimplementing
protocols = { workspace = true }
# Safety/Transform are read from the "safety"/"keys" block of the laser track in the .spell
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bin]]
name = "feeds"
path = "src/bin/feeds.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bench]]
name = "laser"
harness = false
