[workspace]
resolver = "2"
members = ["engine", "protocols", "laser", "script", "pixelmap", "mcp", "serve", "cli", "gui", "bench"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"   # rmcp 3 (crate mcp) requires 1.88
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
axum = { version = "0.8", features = ["ws"] }
socket2 = { version = "0.5", features = ["all"] }
midir = "0.10"   # MIDI input: RtMidi in Rust (winmm on Windows, ALSA on Linux, CoreMIDI on mac)
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
engine = { path = "engine" }
laser = { path = "laser" }
protocols = { path = "protocols" }
script = { path = "script" }
mcp = { path = "mcp" }
serve = { path = "serve" }
cli = { path = "cli" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
