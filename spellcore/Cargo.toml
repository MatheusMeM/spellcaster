[workspace]
resolver = "2"
members = ["engine", "protocols", "laser", "script", "pixelmap", "cli", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
clap = "4"
socket2 = { version = "0.5", features = ["all"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
engine = { path = "engine" }
protocols = { path = "protocols" }
script = { path = "script" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
