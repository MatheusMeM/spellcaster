[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spellcaster"
path = "src/main.rs"

[dependencies]
cli = { workspace = true }
engine = { workspace = true }   # only for `midi::builder`: the MIDI map uses the CLI registry
include_dir = "0.7.4"
serve = { workspace = true }

# The window only exists on Windows (WebView2 already ships with 11); on the Pi the Lite opens
# the GUI in the browser. Outside Windows the binary drags in neither `wry`/`tao` nor the
# webkit2gtk they need, and the CI `cargo build --workspace` (ubuntu, aarch64-musl) keeps
# passing.
[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
