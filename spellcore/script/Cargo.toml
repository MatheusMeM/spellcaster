[package]
name = "script"
version.workspace = true
edition.workspace = true

[dependencies]
engine = { workspace = true }
serde_json = { workspace = true }
# minimal rhai: std (no no_std, it needs files and floats), sync (FrameHook: Send),
# no_custom_syntax (no new syntax in the show), no_time (the clock comes from the engine),
# only_i64 (a single integer type), no_module (the script imports no module),
# no_closure (no closure in the show). Tried and rejected: no_object cuts the method
# syntax `x.len()` and breaks medgrupo.rhai; no_position saves 28 672 bytes but erases
# the line/column of the show compilation error. ponytail: fixed feature list ;
# revisit when the show .rhai needs a map, a module or a closure.
rhai = { version = "1.26", default-features = false, features = ["std", "sync", "no_custom_syntax", "no_time", "only_i64", "no_module", "no_closure"] }
