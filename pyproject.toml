[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcaster"
version = "0.0.1"
description = "Portable light and laser media server: timeline, cues, sACN, Art-Net, OSC and ILDA; web GUI, embedded MCP, Lite for the Raspberry Pi"
license = "MIT"
requires-python = ">=3.11"
dependencies = []                    # runtime = Python 3.13 stdlib; pyinstaller is build-only (packaging/build_win.ps1)

[project.optional-dependencies]
gui = ["pywebview"]                  # native window (WebView2); without it the GUI opens in the default browser
lite = []                            # Raspberry Pi: nothing to install, runs on the system python3

[project.scripts]
spell = "spellcaster.cli:main"

[tool.setuptools.packages.find]
include = ["spellcaster*"]
