[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcaster"
version = "0.0.1"
description = "Media server de luz e laser portátil: timeline, cues, sACN, Art-Net, OSC e ILDA; GUI web, MCP embutido, Lite para Raspberry Pi"
license = "MIT"
requires-python = ">=3.11"
dependencies = []                    # runtime = stdlib do Python 3.13; pyinstaller e so de build (packaging/build_win.ps1)

[project.optional-dependencies]
gui = ["pywebview"]                  # janela nativa (WebView2); sem ela a GUI abre no navegador padrao
lite = []                            # Raspberry Pi: nada a instalar, roda com o python3 do sistema

[project.scripts]
spell = "spellcaster.cli:main"

[tool.setuptools.packages.find]
include = ["spellcaster*"]
