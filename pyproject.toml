[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcaster"
version = "0.0.1"
description = "Show-control portátil da Feitiçaria Industrial: sACN / Art-Net / OSC / ILDA"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spell = "spellcaster.cli:main"

[tool.setuptools.packages.find]
include = ["spellcaster*"]
